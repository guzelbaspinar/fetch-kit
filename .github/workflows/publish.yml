name: Publish

on:
  # Explicit release: push tag v* after bumping package.json on main
  push:
    tags:
      - 'v*'
  # After merge to main: publish only when CI passed and this version is not on npm yet
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  publish:
    runs-on: ubuntu-latest
    # Tag pushes always attempt publish (with version check).
    # workflow_run: only successful pushes to main (not PR CI runs).
    if: >
      github.event_name == 'push' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push'
      )
    permissions:
      actions: read
      contents: read
      id-token: write # required for npm OIDC trusted publishing; no NPM_TOKEN secret
    concurrency:
      group: npm-publish-${{ github.event_name == 'push' && github.ref || github.event.workflow_run.head_branch }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # npm trusted publishing (OIDC) requires npm CLI >= 11.5.1 and Node >= 22.14.0
          node-version: '22.14.0'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Verify npm CLI version
        run: npm --version

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Typecheck examples
        run: npm run typecheck:examples

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify package.json version matches tag
        if: github.event_name == 'push'
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag ($TAG_VERSION) does not match package.json version ($PKG_VERSION)."
            exit 1
          fi

      - name: Skip if this version is already on npm
        id: npm_version
        env:
          PKG_NAME: '@guzelbaspinar/fetch-kit'
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          echo "version=$PKG_VERSION" >> "$GITHUB_OUTPUT"
          if npm view "${PKG_NAME}@${PKG_VERSION}" version 2>/dev/null | grep -qx "$PKG_VERSION"; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "Version ${PKG_VERSION} is already on npm; skipping publish."
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
            echo "Version ${PKG_VERSION} is not on npm; will publish."
          fi

      # OIDC trusted publishing: no NPM_TOKEN or other long-lived secrets.
      # npm CLI picks up the short-lived OIDC token GitHub issues for this workflow.
      # Provenance attestation is added automatically (no --provenance flag needed).
      #
      # PREREQUISITE: configure "Trusted Publisher" on npmjs.com for this package:
      #   Package Settings → Trusted Publisher → GitHub Actions
      #   - Organization/user: guzelbaspinar
      #   - Repository: fetch-kit
      #   - Workflow filename: publish.yml
      #   (The first publish must be done manually once; see steps in README or maintainer notes.)
      - name: Publish to npm (OIDC, tokenless)
        if: steps.npm_version.outputs.already_published != 'true'
        run: npm publish --access public
