name: Publish

on:
  # merge PR → push to main (required for npm OIDC / Trusted Publisher)
  push:
    branches: [main]
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: read
      contents: read
      id-token: write # required for npm OIDC trusted publishing; no NPM_TOKEN secret
      pull-requests: read
    concurrency:
      group: npm-publish
      cancel-in-progress: false
    steps:
      - name: Resolve merged PR head (main pushes only)
        if: github.ref == 'refs/heads/main'
        id: merge
        uses: actions/github-script@v7
        with:
          script: |
            const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
            });
            const merged = prs.find((p) => p.merged_at && p.base.ref === 'main');
            if (!merged) {
              core.setFailed(
                'Publish runs only after a PR is merged to main (not on direct pushes).',
              );
              return;
            }
            core.setOutput('head_sha', merged.head.sha);
            core.setOutput('pr_number', String(merged.number));
            core.info(`Merged PR #${merged.number}; CI will be checked on ${merged.head.sha}.`);

      - name: Require successful CI on merged PR
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          HEAD_SHA="${{ steps.merge.outputs.head_sha }}"
          PR_NUMBER="${{ steps.merge.outputs.pr_number }}"
          REPO="${{ github.repository }}"

          if gh pr checks "$PR_NUMBER" --repo "$REPO"; then
            echo "CI checks passed for PR #${PR_NUMBER}."
            exit 0
          fi

          STATUS_STATE="$(gh api "repos/${REPO}/commits/${HEAD_SHA}/status" --jq -r '.state // empty')"
          if [ "$STATUS_STATE" = "success" ]; then
            echo "Commit status success for ${HEAD_SHA}."
            exit 0
          fi

          CONCLUSION="$(gh run list \
            --repo "$REPO" \
            --workflow=CI \
            --commit="$HEAD_SHA" \
            --limit 1 \
            --json conclusion \
            --jq '.[0].conclusion // empty')"
          if [ "$CONCLUSION" = "success" ]; then
            echo "CI workflow run succeeded for ${HEAD_SHA}."
            exit 0
          fi

          echo "Publish blocked: CI must succeed on merged PR #${PR_NUMBER} (commit ${HEAD_SHA})."
          echo "PR checks failed; commit status=${STATUS_STATE:-none}; CI run conclusion=${CONCLUSION:-none}."
          exit 1

      - uses: actions/checkout@v4

      # Do not pass registry-url to setup-node: it writes _authToken=${NODE_AUTH_TOKEN},
      # which prevents npm from using the Trusted Publisher OIDC exchange (E401/E404).
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: 'npm'

      - name: Prepare npm for Trusted Publishing
        run: |
          npm install -g npm@latest
          npm --version
          npm config set registry https://registry.npmjs.org
          if [ -n "${NPM_CONFIG_USERCONFIG:-}" ] && [ -f "$NPM_CONFIG_USERCONFIG" ]; then
            sed -i '/:_authToken=/d' "$NPM_CONFIG_USERCONFIG" || true
          fi
          unset NODE_AUTH_TOKEN

      - name: Install dependencies
        run: npm ci

      - name: Verify package.json version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag ($TAG_VERSION) does not match package.json version ($PKG_VERSION)."
            exit 1
          fi

      - name: Skip if this version is already on npm
        id: npm_version
        env:
          PKG_NAME: '@guzelbaspinar/fetch-kit'
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          echo "version=$PKG_VERSION" >> "$GITHUB_OUTPUT"
          if npm view "${PKG_NAME}@${PKG_VERSION}" version 2>/dev/null | grep -qx "$PKG_VERSION"; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "Version ${PKG_VERSION} is already on npm; skipping publish."
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
            echo "Version ${PKG_VERSION} is not on npm; will publish."
          fi

      # npm whoami does not reflect OIDC; auth happens during npm publish only.
      - name: Publish to npm (OIDC, tokenless)
        if: steps.npm_version.outputs.already_published != 'true'
        run: npm publish --provenance --access public
