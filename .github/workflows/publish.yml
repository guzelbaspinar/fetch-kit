name: Publish

on:
  # merge PR → push to main (required for npm OIDC / Trusted Publisher)
  push:
    branches: [main]
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write # required for npm OIDC trusted publishing; no NPM_TOKEN secret
    concurrency:
      group: npm-publish
      cancel-in-progress: false
    steps:
      - name: Resolve merged PR head (main pushes only)
        if: github.ref == 'refs/heads/main'
        id: merge
        uses: actions/github-script@v7
        with:
          script: |
            const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
            });
            const merged = prs.find((p) => p.merged_at && p.base.ref === 'main');
            if (!merged) {
              core.setFailed(
                'Publish runs only after a PR is merged to main (not on direct pushes).',
              );
              return;
            }
            core.setOutput('head_sha', merged.head.sha);
            core.info(`Merged PR #${merged.number}; CI will be checked on ${merged.head.sha}.`);

      - name: Require successful CI on merged PR
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          HEAD_SHA="${{ steps.merge.outputs.head_sha }}"
          CONCLUSION="$(gh run list \
            --repo "${{ github.repository }}" \
            --workflow=ci.yml \
            --commit="$HEAD_SHA" \
            --event=pull_request \
            --limit 1 \
            --json conclusion \
            --jq '.[0].conclusion // empty')"
          if [ "$CONCLUSION" != "success" ]; then
            echo "Publish blocked: CI must succeed on PR commit ${HEAD_SHA} (latest CI conclusion: ${CONCLUSION:-none})."
            exit 1
          fi
          echo "CI succeeded on PR commit ${HEAD_SHA}; continuing to publish."

      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # npm trusted publishing (OIDC) requires npm CLI >= 11.5.1 and Node >= 22.14.0
          node-version: '22.14.0'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Verify npm CLI version
        run: npm --version

      - name: Install dependencies
        run: npm ci

      - name: Verify package.json version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag ($TAG_VERSION) does not match package.json version ($PKG_VERSION)."
            exit 1
          fi

      - name: Skip if this version is already on npm
        id: npm_version
        env:
          PKG_NAME: '@guzelbaspinar/fetch-kit'
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          echo "version=$PKG_VERSION" >> "$GITHUB_OUTPUT"
          if npm view "${PKG_NAME}@${PKG_VERSION}" version 2>/dev/null | grep -qx "$PKG_VERSION"; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "Version ${PKG_VERSION} is already on npm; skipping publish."
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
            echo "Version ${PKG_VERSION} is not on npm; will publish."
          fi

      - name: Verify npm OIDC authentication
        if: steps.npm_version.outputs.already_published != 'true'
        run: npm whoami

      # prepublishOnly in package.json runs typecheck, tests, and build before publish
      - name: Publish to npm (OIDC, tokenless)
        if: steps.npm_version.outputs.already_published != 'true'
        run: npm publish --access public
