name: Publish

on:
  # Optional explicit release via tag (must match package.json version)
  push:
    tags:
      - 'v*'
  # npm publish after PR is merged into main (see job guard + CI check)
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  publish:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.pull_request.merged == true
    permissions:
      actions: read
      contents: read
      id-token: write # required for npm OIDC trusted publishing; no NPM_TOKEN secret
    concurrency:
      group: npm-publish
      cancel-in-progress: false
    steps:
      - name: Require successful CI on merged PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          CONCLUSION="$(gh run list \
            --repo "${{ github.repository }}" \
            --workflow=ci.yml \
            --commit="$HEAD_SHA" \
            --event=pull_request \
            --limit 1 \
            --json conclusion \
            --jq '.[0].conclusion // empty')"
          if [ "$CONCLUSION" != "success" ]; then
            echo "Publish blocked: CI must succeed on PR commit ${HEAD_SHA} (latest CI conclusion: ${CONCLUSION:-none})."
            exit 1
          fi
          echo "CI succeeded on PR commit ${HEAD_SHA}; continuing to publish."

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # npm trusted publishing (OIDC) requires npm CLI >= 11.5.1 and Node >= 22.14.0
          node-version: '22.14.0'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Verify npm CLI version
        run: npm --version

      - name: Install dependencies
        run: npm ci

      - name: Verify package.json version matches tag
        if: github.event_name == 'push'
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag ($TAG_VERSION) does not match package.json version ($PKG_VERSION)."
            exit 1
          fi

      - name: Skip if this version is already on npm
        id: npm_version
        env:
          PKG_NAME: '@guzelbaspinar/fetch-kit'
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          echo "version=$PKG_VERSION" >> "$GITHUB_OUTPUT"
          if npm view "${PKG_NAME}@${PKG_VERSION}" version 2>/dev/null | grep -qx "$PKG_VERSION"; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "Version ${PKG_VERSION} is already on npm; skipping publish."
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
            echo "Version ${PKG_VERSION} is not on npm; will publish."
          fi

      # prepublishOnly in package.json runs typecheck, tests, and build before publish
      - name: Publish to npm (OIDC, tokenless)
        if: steps.npm_version.outputs.already_published != 'true'
        run: npm publish --access public
